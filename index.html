<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐẤM THẰNG GẦY</title>
    <style>
        body {
            background-color: #1a1c23;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Impact', sans-serif;
            overflow: hidden;
            transition: background-color 0.05s;
        }

        .flash-tat {
            background-color: #ff003c;
        }

        .flash-bua {
            background-color: #ffffff;
        }

        .flash-dao {
            background-color: #8b0000;
        }

        h1 {
            font-size: 3.5rem;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #000;
            margin-bottom: 5px;
            z-index: 10;
        }

        .counter {
            font-size: 5rem;
            color: #ff3f3f;
            text-shadow: 5px 5px 0px #fff, 10px 10px 0px #000;
            margin-bottom: 20px;
            z-index: 10;
        }

        .weapons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            z-index: 10;
        }

        .weapon-btn {
            background-color: #333;
            color: #fff;
            border: 4px solid #000;
            padding: 10px 30px;
            font-size: 1.5rem;
            font-family: 'Impact', sans-serif;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 4px 4px 0px #000;
        }

        .weapon-btn.active {
            background-color: #ff3f3f;
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .face-container {
            position: relative;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            cursor: crosshair;
            user-select: none;
            overflow: hidden;
            border: 12px solid #000;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            background-color: #111;
        }

        .face-wrapper {
            width: 100%;
            height: 100%;
            transform: scale(1.4);
            transform-origin: center center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform;
        }

        .face {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.4s ease;
            will-change: filter;
        }

        .damage {
            position: absolute;
            pointer-events: none;
            transform-origin: center;
            z-index: 15;
            opacity: 1;
            transition: opacity 1.5s ease-out;
        }

        .damage.fade {
            opacity: 0;
        }

        .bruise {
            border-radius: 50%;
            background: radial-gradient(circle, rgba(40, 0, 50, 0.98) 0%, rgba(70, 10, 20, 0.85) 45%, rgba(30, 30, 80, 0.4) 75%, transparent 100%);
            mix-blend-mode: multiply;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .crack {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(200, 200, 200, 0.5) 20%, transparent 60%);
            clip-path: polygon(50% 50%, 100% 0, 80% 40%, 100% 100%, 60% 80%, 0 100%, 20% 60%, 0 0, 40% 20%);
            mix-blend-mode: overlay;
        }

        .slash {
            background: linear-gradient(90deg, transparent 0%, rgba(150, 0, 0, 0.9) 40%, rgba(255, 0, 0, 1) 50%, rgba(150, 0, 0, 0.9) 60%, transparent 100%);
            border-radius: 50%;
            filter: blur(1px);
            mix-blend-mode: color-burn;
        }
    </style>
</head>

<body>
    <h1>CHỌN ĐỒ:</h1>
    <div class="counter" id="score">0</div>

    <div class="weapons">
        <button class="weapon-btn active" id="wpn-tat">Đấm</button>
        <button class="weapon-btn" id="wpn-bua">Búa</button>
        <button class="weapon-btn" id="wpn-dao">Dao</button>
    </div>

    <div class="face-container" id="target">
        <div class="face-wrapper" id="faceWrapper">
            <img src="z7851556607313_d6f8dab95433f1c63330e4ac839650ca.jpg" alt="Mặt" class="face" id="faceImg">
        </div>
    </div>

    <script>
        const target = document.getElementById('target');
        const faceWrapper = document.getElementById('faceWrapper');
        const faceImg = document.getElementById('faceImg');
        const scoreDisplay = document.getElementById('score');

        let score = 0;
        let resetTimeout;
        let currentWeapon = 'tat';

        const btnTat = document.getElementById('wpn-tat');
        const btnBua = document.getElementById('wpn-bua');
        const btnDao = document.getElementById('wpn-dao');

        function setActiveBtn(btn, weapon) {
            btnTat.classList.remove('active');
            btnBua.classList.remove('active');
            btnDao.classList.remove('active');
            btn.classList.add('active');
            currentWeapon = weapon;
        }

        btnTat.addEventListener('click', () => setActiveBtn(btnTat, 'tat'));
        btnBua.addEventListener('click', () => setActiveBtn(btnBua, 'bua'));
        btnDao.addEventListener('click', () => setActiveBtn(btnDao, 'dao'));

        target.addEventListener('mousedown', (e) => {
            score++;
            scoreDisplay.innerText = score;

            const rect = target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const dmg = document.createElement('div');
            dmg.className = 'damage';

            let flashClass = '';
            let targetScale = 1.4;
            let targetRotate = 0;
            let targetSkewX = 0;
            let targetSkewY = 0;
            let targetSaturate = 1;
            let targetBrightness = 1;

            if (currentWeapon === 'tat') {
                flashClass = 'flash-tat';
                dmg.classList.add('bruise');
                dmg.style.width = (60 + Math.random() * 80) + 'px';
                dmg.style.height = (50 + Math.random() * 70) + 'px';

                targetRotate = (Math.random() - 0.5) * 40;
                targetSkewX = (Math.random() - 0.5) * 30;
                targetSkewY = (Math.random() - 0.5) * 30;
                targetSaturate = Math.random() * 2;
                targetBrightness = 0.7;

            } else if (currentWeapon === 'bua') {
                flashClass = 'flash-bua';
                dmg.classList.add('crack');
                dmg.style.width = (100 + Math.random() * 50) + 'px';
                dmg.style.height = (100 + Math.random() * 50) + 'px';

                targetScale = 1.2;
                targetRotate = (Math.random() - 0.5) * 60;
                targetSkewX = (Math.random() - 0.5) * 60;
                targetSkewY = (Math.random() - 0.5) * 60;
                targetSaturate = 0.2;
                targetBrightness = 1.5;

            } else if (currentWeapon === 'dao') {
                flashClass = 'flash-dao';
                dmg.classList.add('slash');
                dmg.style.width = (150 + Math.random() * 100) + 'px';
                dmg.style.height = (10 + Math.random() * 15) + 'px';

                targetScale = 1.6;
                targetSkewX = (Math.random() > 0.5 ? 40 : -40);
                targetSkewY = (Math.random() - 0.5) * 20;
                targetSaturate = 3;
                targetBrightness = 0.5;
            }

            document.body.classList.add(flashClass);
            setTimeout(() => document.body.classList.remove(flashClass), 50);

            dmg.style.left = x + 'px';
            dmg.style.top = y + 'px';
            dmg.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;

            target.appendChild(dmg);

            setTimeout(() => dmg.classList.add('fade'), 2000);
            setTimeout(() => dmg.remove(), 3500);

            faceWrapper.style.transform = `scale(${targetScale}) rotate(${targetRotate}deg) skew(${targetSkewX}deg, ${targetSkewY}deg)`;
            faceImg.style.filter = `saturate(${targetSaturate}) brightness(${targetBrightness}) contrast(1.5)`;

            clearTimeout(resetTimeout);
            resetTimeout = setTimeout(() => {
                faceWrapper.style.transform = 'scale(1.4) rotate(0deg) skew(0deg, 0deg)';
                faceImg.style.filter = 'saturate(1) brightness(1) contrast(1)';
            }, 2500);
        });
    </script>
</body>

</html>
